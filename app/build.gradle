plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.casanova.espelho'
    compileSdk 34

    defaultConfig {
        applicationId 'com.casanova.espelho'
        minSdk 26
        targetSdk 33
        versionCode 11
        versionName '1.10'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
